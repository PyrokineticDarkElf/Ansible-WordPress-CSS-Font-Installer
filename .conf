# Variables to include in CSS output
default: hex  # What should be the default? hex rgb, hsl, etc. You must include the default below!

# Include HEX values
hex # Include a variable for the HEX value e.g. "#62ff00"
#hex-r # Include a variable for the red value e.g. "62"
#hex-g # Include a variable for the green value e.g. "ff"
#hex-b # Include a variable for the blue value e.g. "00"

# Include RGB values
rgb # Include a variable for the RGB value e.g. "62, 255, 0"
#r # Include a variable for the red value e.g. "62"
#g # Include a variable for the green value e.g. "255"
#b # Include a variable for the blue value e.g. "0"

# Optionally include HSL values
#hsl # Include a variable for the HSL value e.g. "120, 100, 50"
h # Include a variable for the hue value e.g. "120"
s # Include a variable for the saturation value e.g. "100"
l # Include a variable for the lightness value e.g. "50"
